name: Deploy to Azure Databricks

on:
  push:
    branches:
      - main
      - master
      - test
      - dev

jobs:
  unit-tests:
    name: "Run Unit Tests & Coverage"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=src/dlt_pipeline --cov-report=term-missing

  deploy:
    name: "Deploy Bundle"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Determine Target Environment
        id: set-target
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "TARGET=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "test" ]]; then
            echo "TARGET=test" >> $GITHUB_ENV
          else
            echo "TARGET=dev" >> $GITHUB_ENV
          fi

      - name: Deploy Databricks Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Deploying to target: ${{ env.TARGET }}"
          databricks bundle deploy --target ${{ env.TARGET }}