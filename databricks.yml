bundle:
  name: crm_marketing_pipeline

targets:
  dev:
    default: true

resources:
  pipelines:
    crm_dlt_pipeline:
      name: "Marketing CRM DLT Pipeline"
      target: "dev"
      development: true
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./src/dlt_pipeline/01_bronze.py
        - file:
            path: ./src/dlt_pipeline/02_silver.py
        - file:
            path: ./src/dlt_pipeline/03_gold.py