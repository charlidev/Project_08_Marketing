bundle:
  name: crm_marketing_pipeline

targets:
  dev:
    default: true

resources:
  pipelines:
    crm_dlt_pipeline:
      name: "Marketing CRM DLT Pipeline"
      target: "dev"
      mode: development
      continuous: false
      clusters:
        - label: "default"
          num_workers: 1
      libraries:
        - file:
            path: ./src/dlt_pipeline/01_bronze.py
        - file:
            path: ./src/dlt_pipeline/02_silver.py
        - file:
            path: ./src/dlt_pipeline/03_gold.py