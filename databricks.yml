bundle:
  name: crm_marketing_pipeline

resources:
  pipelines:
    crm_dlt_pipeline:
      name: "Marketing CRM DLT Pipeline [${bundle.target}]"
      target: "marketing_schema_${bundle.target}"
      catalog: "marketing"
      continuous: false
      serverless: true
      libraries:
        - file:
            path: ./src/dlt_pipeline/01_bronze.py
        - file:
            path: ./src/dlt_pipeline/02_silver.py
        - file:
            path: ./src/dlt_pipeline/03_gold.py

targets:
  dev:
    default: true
    resources:
      pipelines:
        crm_dlt_pipeline:
          development: true

  test:
    resources:
      pipelines:
        crm_dlt_pipeline:
          development: true

  prod:
    resources:
      pipelines:
        crm_dlt_pipeline:
          development: false